# ── 6.C Continuous Purging ──
- node_id: "S-120"
  body: "Continuous Purging"
  parent_id: "S-022"
  section_lineage: ["S-001", "S-022"]
  is_leaf: false
  order: 120

- node_id: "S-121"
  body: "NOTE:  If continuous purging is preferred or necessary, proceed with this section C.  If step-up and stepdown purging is preferred or necessary, proceed with section D below."
  parent_id: "S-120"
  section_lineage: ["S-001", "S-022", "S-120"]
  is_leaf: true
  order: 121

- node_id: "S-122"
  body: "Slowly increase wet skid pressure to 100-120 psig by using low point drain between SDV-700 and PCV-705."
  parent_id: "S-120"
  section_lineage: ["S-001", "S-022", "S-120"]
  is_leaf: true
  order: 122

- node_id: "S-123"
  body: "Operator continue to check for leaks throughout the plant especially at the areas where piping may have been opened for maintenance."
  parent_id: "S-120"
  section_lineage: ["S-001", "S-022", "S-120"]
  is_leaf: true
  order: 123

- node_id: "S-124"
  body: "Operator should monitor gas detectors and fire eyes during this process."
  parent_id: "S-120"
  section_lineage: ["S-001", "S-022", "S-120"]
  is_leaf: true
  order: 124

- node_id: "S-125"
  body: "After pressure is verified to be 100-120 psig throughout the wet skid, operator will open (2) 1-\u00bd\u201d gate valves on P-787 and P-788 to high pressure flare and leave open until any and all present oxygen has been purged from the system."
  parent_id: "S-120"
  section_lineage: ["S-001", "S-022", "S-120"]
  is_leaf: true
  order: 125

- node_id: "S-126"
  body: "Operator to maintain 100-120 psig during the continuous purge process by regulating purge gas at low point drain between SDV-700 and PCV-705."
  parent_id: "S-120"
  section_lineage: ["S-001", "S-022", "S-120"]
  is_leaf: true
  order: 126

- node_id: "S-127"
  body: "After all present oxygen has been purged from the wet skid, operator will close low point drain between SDV-700 and PCV-705."
  parent_id: "S-120"
  section_lineage: ["S-001", "S-022", "S-120"]
  is_leaf: true
  order: 127

- node_id: "S-128"
  body: "Operator to close (2) 1-\u00bd\u201d gate valves on P-787 and P-788 to high pressure flare."
  parent_id: "S-120"
  section_lineage: ["S-001", "S-022", "S-120"]
  is_leaf: true
  order: 128

- node_id: "S-129"
  body: "NOTE:  To verify that oxygen is completely purged, operator to crack high point vent and check for oxygen on all vessels."
  parent_id: "S-120"
  section_lineage: ["S-001", "S-022", "S-120"]
  is_leaf: true
  order: 129

# ── 6.D Step-Up and Stepdown Purging ──
- node_id: "S-130"
  body: "Step-Up and Stepdown Purging"
  parent_id: "S-022"
  section_lineage: ["S-001", "S-022"]
  is_leaf: false
  order: 130

- node_id: "S-131"
  body: "Slowly increase wet skid pressure to 50-120 psig by using low point drain between SDV-700 and PCV-705."
  parent_id: "S-130"
  section_lineage: ["S-001", "S-022", "S-130"]
  is_leaf: true
  order: 131

- node_id: "S-132"
  body: "After the gas pressure is verified to be 50 psig throughout the wet skid, operator to close low point drain between SDV-700 and PCV-705."
  parent_id: "S-130"
  section_lineage: ["S-001", "S-022", "S-130"]
  is_leaf: true
  order: 132

- node_id: "S-133"
  body: "Operator opens (2) 1-\u00bd\u201d gate valves on P-787 and P-788 to high pressure flare."
  parent_id: "S-130"
  section_lineage: ["S-001", "S-022", "S-130"]
  is_leaf: true
  order: 133

- node_id: "S-134"
  body: "After pressure has been blow down, repeat all steps above for 100 psig purge test and 120 psig thereafter."
  parent_id: "S-130"
  section_lineage: ["S-001", "S-022", "S-130"]
  is_leaf: true
  order: 134

- node_id: "S-135"
  body: "NOTE:  To verify that oxygen is completely purged, operator to crack high point vent and check for oxygen on all vessels."
  parent_id: "S-130"
  section_lineage: ["S-001", "S-022", "S-130"]
  is_leaf: true
  order: 135

